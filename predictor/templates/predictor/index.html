<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tomato Disease Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1b5e20;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f1f8e9;
            border-radius: 10px;
        }

        .result h2 {
            color: #2e7d32;
        }

        .confidence {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍅 Tomato Disease Detection</h1>

    <p class="description">
        Upload a tomato leaf image and let the AI detect the disease.
    </p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <br>

        <button type="submit">
            Predict Disease
        </button>

    </form>


    {% if predicted_class %}

    <div class="result">

        <h2>Prediction Result</h2>

        <p>
            <strong>Disease:</strong>
            {{ predicted_class }}
        </p>

        <p class="confidence">
            Confidence:
            {{ confidence|floatformat:2 }}%
        </p>

    </div>

    {% endif %}

</div>

</body>
</html>
